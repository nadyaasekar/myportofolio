<div id="education-form-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="education-modal-title">

    <button type="button"
            class="experience-form-modal__backdrop"
            popovertarget="education-form-modal"
            popovertargetaction="hide"
            aria-label="Tutup form"></button>

    <div class="experience-form-modal__content">
        <button type="button"
                class="experience-form-modal__close"
                popovertarget="education-form-modal"
                popovertargetaction="hide"
                aria-label="Tutup form">
            ×
        </button>

        <h2 id="education-modal-title">ADD NEW EDUCATION</h2>

        <form id="education-form"
              method="post"
              action="{% url 'main:create_education_ajax' %}">

            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}"
                           class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.help_text %}
                        <p>{{ field.help_text }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="experience-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="education-form-modal"
                        popovertargetaction="hide">
                    Batal
                </button>

                <button type="submit" class="button button-primary">
                    Simpan Education
                </button>
            </div>
        </form>
    </div>
</div>

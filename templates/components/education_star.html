<form method="post"
      action="{% url 'main:toggle_star_education' education.id %}"
      class="star-form">
    {% csrf_token %}

    <button type="submit"
            class="button button-star{% if user in education.starred_by.all %} is-starred{% endif %}">
        <span aria-hidden="true">★</span>

        {% if user in education.starred_by.all %}
            Unstar
        {% else %}
            Star
        {% endif %}

        <span class="star-count">
            {{ education.starred_by.count }}
        </span>
    </button>
</form>

<div id="experience-form-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-form-modal-title">

    <button type="button"
            class="experience-form-modal__backdrop"
            onclick="closeExperienceModal()"
            aria-label="Tutup form"></button>

    <div class="experience-form-modal__content">
        <button type="button"
                class="experience-form-modal__close"
                onclick="closeExperienceModal()"
                aria-label="Tutup form">
            ×
        </button>

        <h2 id="experience-form-modal-title">
            ADD NEW EXPERIENCE
        </h2>

        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience' %}"
              class="custom-form">

            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}"
                           class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.help_text %}
                        <p>{{ field.help_text }}</p>
                    {% endif %}

                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="experience-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        onclick="closeExperienceModal()">
                    Batal
                </button>

                <button type="submit"
                        class="button button-primary">
                    Simpan Experience
                </button>
            </div>
        </form>
    </div>
</div>
